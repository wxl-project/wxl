<p>Besides accessible name, common accessibility properties include:</p>
<ul>
<li>Description and help text</li>
<li>Position in set</li>
<li>Headings and landmarks (see below)</li>
</ul>
<p>See <a href="https://learn.microsoft.com/windows/apps/design/accessibility/basic-accessibility-information">Expose basic accessibility information</a> and <a href="https://learn.microsoft.com/accessibility-tools-docs/items/uwpxaml/control_fulldescription_describedby_helptext">UWP XAML: Setting supplemental information on a control</a>.</p>
