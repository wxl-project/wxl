# The tool set of the package WinXL: the generator winui-srcgen, the profile
# editor wxl.gen.ui and the utility winxl, built in the x64-static build
# directory -- the CRT linked statically (CMakePresets.json) -- in Release,
# run, tested and collected into artifact/wxl-tools-x64 at the root of the
# tree: what the job of tools.yml does between the checkout and the upload,
# and what the CI of an application that builds WinXL from a checkout of wxl
# does the same way.
#
#   version  the version the tools carry (cmake/wxl_package_version.cmake),
#            which winxl --version prints
#
# The tree is the one this action is in, wherever it is checked out: every
# step works at its root. The job gives the environment the workflows of the
# tree give: DEVCMD and VCVARS for the developer environment of MSVC 14.53 and
# the WinUI build tools, installed before, NUGET_PACKAGES and
# RestoreLockedMode for the restore of the configure. winxl is published by
# the .NET SDK 10 of the runner image (windows-2025 lists 10.0 SDKs among its
# .NET Core tools); cmake/wxl_winxl.cmake stops the configure if it is missing.
name: package-tools
description: The tool set of WinXL, built, run, tested and collected into artifact/wxl-tools-x64 at the root of the tree.

inputs:
  version:
    description: The version the tools carry, which winxl --version prints.
    required: true

runs:
  using: composite
  steps:
    # BUILD_TESTING for the tests of the generator and of its common library,
    # which the next steps build and run; WXL_WINXL for the utility;
    # WXL_PACKAGE_VERSION for the version winxl prints; WXL_REPRODUCIBLE_BUILD
    # for executables that are the same bytes from the same commit and toolset,
    # wherever the tree is checked out.
    - name: Configure
      shell: cmd
      working-directory: ${{ github.action_path }}/../../..
      env:
        WXL_PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
        dotnet --list-sdks
        cmake --preset x64-static -DBUILD_TESTING=ON -DWXL_WINXL=ON "-DWXL_PACKAGE_VERSION=%WXL_PACKAGE_VERSION%" -DWXL_REPRODUCIBLE_BUILD=ON

    - name: Build
      shell: cmd
      working-directory: ${{ github.action_path }}/../../..
      run: |
        call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
        cmake --build build\x64-static --config Release --target winui-srcgen wxl.gen.ui winxl wxl.gen.tests wxl.gen.common.tests -- -k 0

    # Each executable started once: a tool linked with the static CRT has to
    # load and answer before anything relies on it. winxl answers with the
    # version it was given.
    - name: Run the tools
      shell: pwsh
      working-directory: ${{ github.action_path }}/../../..
      env:
        WXL_PACKAGE_VERSION: ${{ inputs.version }}
      run: |
        & .\build\x64-static\wxl.gen\Release\winui-srcgen.exe --help
        if ($LASTEXITCODE -ne 0) { throw "winui-srcgen --help exited with $LASTEXITCODE" }
        $version = & .\build\x64-static\winxl\winxl.exe --version
        if ($LASTEXITCODE -ne 0) { throw "winxl --version exited with $LASTEXITCODE" }
        if ($version -ne $env:WXL_PACKAGE_VERSION) { throw "winxl --version printed '$version', not $env:WXL_PACKAGE_VERSION" }

    # The tests of the tools, each from its own directory: the preset would
    # list every program of the tree, and the ones not built would fail.
    - name: Test
      shell: cmd
      working-directory: ${{ github.action_path }}/../../..
      run: |
        call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
        ctest --test-dir build\x64-static\wxl.gen\tests -C Release --output-on-failure --timeout 300 || exit /b 1
        ctest --test-dir build\x64-static\wxl.gen.common\tests -C Release --output-on-failure --timeout 300 || exit /b 1

    # The executables with what they need beside them -- the editor's folder
    # holds its assets and the runtime libraries it loads -- without the
    # debugging symbols.
    - name: Collect the tools
      shell: pwsh
      working-directory: ${{ github.action_path }}/../../..
      run: |
        $out = New-Item -ItemType Directory -Force -Path 'artifact\wxl-tools-x64'
        Copy-Item 'build\x64-static\wxl.gen\Release\winui-srcgen.exe' $out
        Copy-Item 'build\x64-static\winxl\winxl.exe' $out
        $editor = New-Item -ItemType Directory -Force -Path (Join-Path $out 'wxl.gen.ui')
        Copy-Item 'build\x64-static\wxl.gen.ui\Release\*' $editor -Recurse -Exclude '*.pdb', '*.ilk'
        Get-ChildItem $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.FullName.Length + 1) }
