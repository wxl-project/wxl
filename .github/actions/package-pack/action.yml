# The package WinXL packed from the two installs of package-libs and the tool
# set of package-tools: what the job pack of package.yml does between the
# downloads and the upload, and what the CI of an application that builds
# WinXL from a checkout of wxl does the same way. The job puts them at the
# root of the tree, where the action reads them:
#
#   install-md  stage/ of package-libs with x64-dynamic
#   install-mt  stage/ of package-libs with x64-static
#   tools-x64   artifact/wxl-tools-x64 of package-tools
#
# The two installs are merged into one prefix -- the archives and the export
# of each build in lib/<md|mt> and lib/cmake/wxl/<md|mt>, everything else the
# same in both, which the action checks -- with the tool set in bin, and
# packed by tools/package/pack.cmake into package/WinXL.<version>.nupkg at the
# root of the tree.
#
#   version  the version of the commit, which the installs carry: the
#            package is checked to be of it
#   commit   the commit the package is built from, which its manifest names
#
# The tree is the one this action is in, wherever it is checked out: the step
# works at its root. CMake 4.5 and the .NET SDK of tools/package/global.json
# are on PATH.
#
# The steps are those of tools/package/build.ps1 -Step Pack, which a machine
# runs as well: merge the installs and the tool set into stage/, pack, and
# check what a run can check of the reproducibility without a second build --
# no archive or CMake file of lib and no executable directly in bin names the
# tree, every member of an archive has the time -1 of lib /Brepro, and the
# prefix packed a second time (into WinXL-again in RUNNER_TEMP) is the same
# bytes.
name: package-pack
description: WinXL packed from the two installs and the tool set into package/WinXL.<version>.nupkg at the root of the tree.

inputs:
  version:
    description: The version of the commit, which the installs carry.
    required: true
  commit:
    description: The full hash of the commit the package is built from.
    required: true

runs:
  using: composite
  steps:
    - name: Merge, pack and check the package is reproducible
      shell: pwsh
      working-directory: ${{ github.action_path }}/../../..
      env:
        WXL_PACKAGE_VERSION: ${{ inputs.version }}
        WXL_PACK_COMMIT: ${{ inputs.commit }}
      run: |
        & "$env:GITHUB_ACTION_PATH/../../../tools/package/build.ps1" -Step Pack -Version $env:WXL_PACKAGE_VERSION -Commit $env:WXL_PACK_COMMIT
