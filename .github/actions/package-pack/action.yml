# The package WinXL packed from the two installs of package-libs and the tool
# set of package-tools: what the job pack of package.yml does between the
# downloads and the upload, and what the CI of an application that builds
# WinXL from a checkout of wxl does the same way. The job puts them at the
# root of the tree, where the action reads them:
#
#   install-md  stage/ of package-libs with x64-dynamic
#   install-mt  stage/ of package-libs with x64-static
#   tools-x64   artifact/wxl-tools-x64 of package-tools
#
# The two installs are merged into one prefix -- the archives and the export
# of each build in lib/<md|mt> and lib/cmake/wxl/<md|mt>, everything else the
# same in both, which the action checks -- with the tool set in bin, and
# packed by tools/package/pack.cmake into package/WinXL.<version>.nupkg at the
# root of the tree.
#
#   version  the version of the commit, which the installs carry: the
#            package is checked to be of it
#   commit   the commit the package is built from, which its manifest names
#
# The tree is the one this action is in, wherever it is checked out: every
# step works at its root. CMake 4.5 and the .NET SDK of tools/package/global.json
# are on PATH.
name: package-pack
description: WinXL packed from the two installs and the tool set into package/WinXL.<version>.nupkg at the root of the tree.

inputs:
  version:
    description: The version of the commit, which the installs carry.
    required: true
  commit:
    description: The full hash of the commit the package is built from.
    required: true

runs:
  using: composite
  steps:
    # Everything the two installs share is the same in both: the module
    # interfaces, the headers, the components, the profiles, the helpers, the
    # configuration and its version. Apart are the archives and the export
    # of each build, and the generator in bin, which the tool set replaces.
    - name: Merge the installs
      shell: pwsh
      working-directory: ${{ github.action_path }}/../../..
      run: |
        function Get-Shared($root) {
          $root = (Resolve-Path $root).Path
          Get-ChildItem $root -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } |
            Where-Object { $_ -notmatch '^(lib/(md|mt)/|lib/cmake/wxl/(md|mt)/|bin/)' } | Sort-Object
        }
        $md = @(Get-Shared 'install-md')
        $mt = @(Get-Shared 'install-mt')
        $diff = Compare-Object $md $mt
        if ($diff) { $diff | Format-Table -AutoSize | Out-String | Write-Host; throw 'the two installs do not hold the same files' }
        foreach ($file in $md) {
          if ((Get-FileHash "install-md/$file").Hash -ne (Get-FileHash "install-mt/$file").Hash) { throw "$file differs between the two installs" }
        }
        foreach ($variant in 'md', 'mt') {
          foreach ($dir in "lib/$variant", "lib/cmake/wxl/$variant") {
            if (-not (Test-Path "install-$variant/$dir")) { throw "install-$variant has no $dir" }
          }
        }
        "$($md.Count) files the same in both"

        New-Item -ItemType Directory stage | Out-Null
        Copy-Item install-md/* stage -Recurse
        Copy-Item install-mt/lib/mt stage/lib -Recurse
        Copy-Item install-mt/lib/cmake/wxl/mt stage/lib/cmake/wxl -Recurse
        Remove-Item stage/bin -Recurse
        New-Item -ItemType Directory stage/bin | Out-Null
        Copy-Item tools-x64/* stage/bin -Recurse
        foreach ($file in 'bin/winui-srcgen.exe', 'bin/winxl.exe') {
          if (-not (Test-Path "stage/$file")) { throw "the tool set has no $file" }
        }

    - name: Pack
      shell: pwsh
      working-directory: ${{ github.action_path }}/../../..
      env:
        WXL_PACKAGE_VERSION: ${{ inputs.version }}
        WXL_PACK_COMMIT: ${{ inputs.commit }}
      run: |
        cmake "-DWXL_PACK_STAGE=$PWD/stage" "-DWXL_PACK_OUTPUT=$PWD/package" "-DWXL_PACK_COMMIT=$env:WXL_PACK_COMMIT" -P tools/package/pack.cmake
        if ($LASTEXITCODE -ne 0) { throw "pack.cmake exited with $LASTEXITCODE" }
        $package = "package/WinXL.$env:WXL_PACKAGE_VERSION.nupkg"
        if (-not (Test-Path $package)) { throw "no ${package}: the version of the install is not $env:WXL_PACKAGE_VERSION" }

    # The package made again from the commit with the same toolset is the same
    # bytes but for the profile editor, whose link MSVC 14.53 does not repeat
    # (WXL_REPRODUCIBLE_BUILD, tools/package/pack.cmake, docs/building.md).
    # Without a second build a run checks what it can: no archive or CMake file of lib and no
    # executable directly in bin names the tree -- the builds ran at the same
    # root, and the maps of the compiler took the paths out of the objects;
    # every member of an archive has the time -1 of lib /Brepro; and the prefix
    # packed a second time is the same bytes. The profile editor in
    # bin/wxl.gen.ui is not searched: it opens the profiles and components of
    # the tree it was built from, whose paths it carries.
    - name: Check the package is reproducible
      shell: pwsh
      working-directory: ${{ github.action_path }}/../../..
      env:
        WXL_PACKAGE_VERSION: ${{ inputs.version }}
        WXL_PACK_COMMIT: ${{ inputs.commit }}
      run: |
        $tree = $PWD.Path.TrimEnd('\', '/')
        $forms = @($tree.Replace('/', '\'), $tree.Replace('\', '/'))
        $latin1 = [Text.Encoding]::Latin1
        foreach ($file in @(Get-ChildItem stage/lib -Recurse -File) + @(Get-ChildItem stage/bin -File)) {
          $bytes = [IO.File]::ReadAllBytes($file.FullName)
          # One character per byte, and UTF-16 from either alignment.
          $texts = @($latin1.GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes))
          if ($bytes.Length -gt 1) { $texts += [Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1) }
          foreach ($text in $texts) {
            foreach ($form in $forms) {
              if ($text.IndexOf($form, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "$($file.FullName) names the tree $form" }
            }
          }
          if ($file.Extension -eq '.lib') {
            # !<arch>, then each member: a header of 60 bytes -- the date in
            # bytes 16 to 28, the size in 48 to 58 -- and the data, padded to
            # an even length.
            if ($latin1.GetString($bytes, 0, 8) -ne "!<arch>`n") { throw "$($file.FullName) is not an archive" }
            $at = 8
            while ($at -lt $bytes.Length) {
              $date = $latin1.GetString($bytes, $at + 16, 12).Trim()
              if ($date -ne '-1') { throw "$($file.FullName): a member at $at has the time $date, not -1 of lib /Brepro" }
              $size = [long]$latin1.GetString($bytes, $at + 48, 10).Trim()
              $at += 60 + $size + ($size % 2)
            }
          }
        }
        $again = Join-Path $env:RUNNER_TEMP 'WinXL-again'
        cmake "-DWXL_PACK_STAGE=$PWD/stage" "-DWXL_PACK_OUTPUT=$again" "-DWXL_PACK_COMMIT=$env:WXL_PACK_COMMIT" -P tools/package/pack.cmake
        if ($LASTEXITCODE -ne 0) { throw "pack.cmake exited with $LASTEXITCODE" }
        $first = (Get-FileHash "package/WinXL.$env:WXL_PACKAGE_VERSION.nupkg" -Algorithm SHA512).Hash
        $second = (Get-FileHash "$again/WinXL.$env:WXL_PACKAGE_VERSION.nupkg" -Algorithm SHA512).Hash
        if ($first -ne $second) { throw "the prefix packed twice gives two packages: $first and $second" }
        "SHA-512 $first"
