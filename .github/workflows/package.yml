# The NuGet package WinXL, made, uploaded as the artifact WinXL of the run and
# tested as an application takes it: each consumer job publishes the package
# into a local feed, a directory of its own, and restores it from there. The
# package is published nowhere else. Called by release.yml, so that a release
# makes its package; by ci.yml in the merge queue for a pull request that asks
# for the package and on a run of ci by hand; and run by hand.
#
#   version  the version of the commit, from the history down to the last
#            release tag (cmake/wxl_package_version.cmake): v0.1.0 and 64
#            commits after it are 0.1.0.64, the commit of the tag v0.2.0 is
#            0.2.0. Every build below is given it, so the archives, the
#            configuration and the tools all say the same.
#   libs     the tree installed twice: x64-dynamic (the CRT in a DLL) and
#            x64-static (the static CRT), each Debug and Release, with the
#            debugging information in the objects of the archives (/Z7,
#            CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded) -- a package has no
#            place for the .pdb files of a compiler. Only the targets the
#            install takes are built: wxl.core, fmt.module, wxl.ui.common and
#            winui-srcgen.
#   tools    the tool set of tools.yml: the generator, the profile editor and
#            winxl, x64-static Release, tested; the artifact wxl-tools-x64.
#   pack     the two installs merged into one prefix -- the archives and the
#            export of each build in lib/<md|mt> and lib/cmake/wxl/<md|mt>,
#            everything else the same in both, which the job checks -- with the
#            tool set in bin, packed by tools/package/pack.cmake into
#            WinXL.<version>.nupkg, the artifact WinXL.
#   consumer the package used as an application uses it: tests/package-consumer
#            copied out of the checkout with the provider
#            cmake/winxl-provider.cmake, the package published by
#            tools/package/publish.cmake into feed/ of the copy, the local
#            source its nuget.config names, restored through the provider,
#            configured and built Debug and Release with the CRT in a DLL (md)
#            and with the static one in Release (mixed); nothing of the
#            checkout may reach its build, core-only runs and prints the
#            version, and the window of demo opens on the Windows App Runtime
#            winxl of the package installs.
#   consumer-msbuild  the package used as a Visual Studio project uses it:
#            tests/package-consumer/msbuild/demo.vcxproj, copied out of the
#            checkout with the package published into feed/ as above, restores
#            WinXL by its PackageReference and builds core-only Debug and
#            Release through WinXL.props and WinXL.targets of the package;
#            core-only runs and prints the version.
#
# The toolset and the WinUI build tools are installed as in ci.yml, and the
# restore of the configure of the tree runs in locked mode as there.
name: package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The name of the workflow is the caller's under workflow_call, so the group of
# a release's package is apart from the release's own and from that of the
# rows of ci.yml it calls, and the package ci.yml calls is apart from the rows
# of ci.yml (ci-package-<ref> and ci-<ref>): neither cancels the other. A
# package is not cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The whole history with the tags: git describe counts the commits since
      # the last release tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version of the commit
        id: version
        run: |
          version=$(cmake -P cmake/wxl_package_version.cmake)
          echo "WinXL $version, commit $GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  libs:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: x64-dynamic
            variant: md
          - preset: x64-static
            variant: mt
    name: libs (${{ matrix.preset }})
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DEVCMD: C:\BuildToolsInsiders\Common7\Tools\VsDevCmd.bat
      VCVARS: -vcvars_ver=14.53
      NUGET_PACKAGES: C:\nuget-packages
      RestoreLockedMode: true
      WXL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install MSVC 14.53 and the WinUI build tools
        shell: pwsh
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/insiders/vs_buildtools.exe' -OutFile $boot -UseBasicParsing
          $p = Start-Process -FilePath $boot -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -ArgumentList @(
            '--installPath', 'C:\BuildToolsInsiders',
            '--add', 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
            '--add', 'Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools',
            '--quiet', '--wait', '--norestart', '--nocache')
          "exit code $($p.ExitCode)"
          Get-ChildItem 'C:\BuildToolsInsiders\VC\Tools\MSVC' | ForEach-Object { $_.Name }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Build Tools install failed: $($p.ExitCode)" }

      # The library and its install rules, and nothing an install does not
      # take: no samples, no sandbox, no site, no tests.
      - name: Configure
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --preset ${{ matrix.preset }} -DWXL_INSTALL=ON "-DWXL_PACKAGE_VERSION=%WXL_PACKAGE_VERSION%" -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DWXL_SAMPLES=OFF -DWXL_SANDBOX=OFF -DWXL_BUILD_DOCS=OFF

      # Every compile of both configurations takes /Z7 and none /Zi, which would
      # leave the debugging information in a .pdb beside the build.
      - name: Check the debugging information
        shell: pwsh
        run: |
          foreach ($config in 'Debug', 'Release') {
            $rules = "build\${{ matrix.preset }}\CMakeFiles\impl-$config.ninja"
            if (Select-String -Path $rules -Pattern '[-/]Zi\b' -Quiet) { throw "$rules compiles with /Zi" }
            if (-not (Select-String -Path $rules -Pattern '[-/]Z7\b' -Quiet)) { throw "$rules compiles nothing with /Z7" }
          }

      - name: Build
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --build build\${{ matrix.preset }} --config Debug --target wxl.core fmt.module wxl.ui.common winui-srcgen -- -k 0 || exit /b 1
          cmake --build build\${{ matrix.preset }} --config Release --target wxl.core fmt.module wxl.ui.common winui-srcgen -- -k 0 || exit /b 1

      # In the developer environment as well: its CMake configured the tree, and
      # the CMake of the runner image is older than the tree accepts.
      - name: Install
        shell: cmd
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --install build\${{ matrix.preset }} --config Debug --prefix stage || exit /b 1
          cmake --install build\${{ matrix.preset }} --config Release --prefix stage || exit /b 1

      - name: Upload the install
        uses: actions/upload-artifact@v7
        with:
          name: wxl-install-${{ matrix.variant }}
          path: stage/
          if-no-files-found: error

  tools:
    needs: [version]
    uses: ./.github/workflows/tools.yml
    with:
      version: ${{ needs.version.outputs.version }}

  pack:
    needs: [version, libs, tools]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WXL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: wxl-install-md
          path: install-md
      - uses: actions/download-artifact@v8
        with:
          name: wxl-install-mt
          path: install-mt
      - uses: actions/download-artifact@v8
        with:
          name: wxl-tools-x64
          path: tools-x64

      # Everything the two installs share is the same in both: the module
      # interfaces, the headers, the components, the profiles, the helpers, the
      # configuration and its version. Apart are the archives and the export
      # of each build, and the generator in bin, which the tool set replaces.
      - name: Merge the installs
        shell: pwsh
        run: |
          function Get-Shared($root) {
            $root = (Resolve-Path $root).Path
            Get-ChildItem $root -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } |
              Where-Object { $_ -notmatch '^(lib/(md|mt)/|lib/cmake/wxl/(md|mt)/|bin/)' } | Sort-Object
          }
          $md = @(Get-Shared 'install-md')
          $mt = @(Get-Shared 'install-mt')
          $diff = Compare-Object $md $mt
          if ($diff) { $diff | Format-Table -AutoSize | Out-String | Write-Host; throw 'the two installs do not hold the same files' }
          foreach ($file in $md) {
            if ((Get-FileHash "install-md/$file").Hash -ne (Get-FileHash "install-mt/$file").Hash) { throw "$file differs between the two installs" }
          }
          foreach ($variant in 'md', 'mt') {
            foreach ($dir in "lib/$variant", "lib/cmake/wxl/$variant") {
              if (-not (Test-Path "install-$variant/$dir")) { throw "install-$variant has no $dir" }
            }
          }
          "$($md.Count) files the same in both"

          New-Item -ItemType Directory stage | Out-Null
          Copy-Item install-md/* stage -Recurse
          Copy-Item install-mt/lib/mt stage/lib -Recurse
          Copy-Item install-mt/lib/cmake/wxl/mt stage/lib/cmake/wxl -Recurse
          Remove-Item stage/bin -Recurse
          New-Item -ItemType Directory stage/bin | Out-Null
          Copy-Item tools-x64/* stage/bin -Recurse
          foreach ($file in 'bin/winui-srcgen.exe', 'bin/winxl.exe') {
            if (-not (Test-Path "stage/$file")) { throw "the tool set has no $file" }
          }

      - name: Pack
        shell: pwsh
        run: |
          cmake "-DWXL_PACK_STAGE=$PWD/stage" "-DWXL_PACK_OUTPUT=$PWD/package" "-DWXL_PACK_COMMIT=$env:GITHUB_SHA" -P tools/package/pack.cmake
          if ($LASTEXITCODE -ne 0) { throw "pack.cmake exited with $LASTEXITCODE" }
          $package = "package/WinXL.$env:WXL_PACKAGE_VERSION.nupkg"
          if (-not (Test-Path $package)) { throw "no ${package}: the version of the install is not $env:WXL_PACKAGE_VERSION" }

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: WinXL
          path: package/WinXL.*.nupkg
          if-no-files-found: error

  consumer:
    needs: [version, pack]
    strategy:
      fail-fast: false
      matrix:
        preset: [md, mixed]
    name: consumer (${{ matrix.preset }})
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DEVCMD: C:\BuildToolsInsiders\Common7\Tools\VsDevCmd.bat
      VCVARS: -vcvars_ver=14.53
      WXL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      # The installation an application on wxl needs: MSVC 14.53 and the WinUI
      # build tools, whose MSBuild restores the package and its dependencies.
      - name: Install MSVC 14.53 and the WinUI build tools
        shell: pwsh
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/insiders/vs_buildtools.exe' -OutFile $boot -UseBasicParsing
          $p = Start-Process -FilePath $boot -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -ArgumentList @(
            '--installPath', 'C:\BuildToolsInsiders',
            '--add', 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
            '--add', 'Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools',
            '--quiet', '--wait', '--norestart', '--nocache')
          "exit code $($p.ExitCode)"
          Get-ChildItem 'C:\BuildToolsInsiders\VC\Tools\MSVC' | ForEach-Object { $_.Name }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Build Tools install failed: $($p.ExitCode)" }

      # The application, out of the checkout: its sources and the provider in
      # its cmake/ as its preset names it. Nothing else of the checkout is
      # copied.
      - name: Copy the application out of the checkout
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'package-consumer'
          Copy-Item tests/package-consumer $app -Recurse
          New-Item -ItemType Directory "$app/cmake" | Out-Null
          Copy-Item cmake/winxl-provider.cmake "$app/cmake"
          "APP=$app" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          name: WinXL
          path: ${{ runner.temp }}/WinXL

      # Into feed/ of the application, the local source of its nuget.config.
      - name: Publish the package into the local feed
        shell: pwsh
        run: |
          cmake "-DWXL_PUBLISH_PACKAGE=$env:RUNNER_TEMP/WinXL/WinXL.$env:WXL_PACKAGE_VERSION.nupkg" "-DWXL_PUBLISH_FEED=$env:APP/feed" -P tools/package/publish.cmake
          if ($LASTEXITCODE -ne 0) { throw "publish.cmake exited with $LASTEXITCODE" }

      # The lock file is not there, so the restore writes one, and the
      # environment has no RestoreLockedMode: a locked restore stops without it.
      - name: Configure
        shell: cmd
        working-directory: ${{ env.APP }}
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: cmd
        working-directory: ${{ env.APP }}
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --build --preset ${{ matrix.preset }}-debug -- -k 0 || exit /b 1
          cmake --build --preset ${{ matrix.preset }}-release -- -k 0 || exit /b 1

      # The package is self-contained: the cache and the compile commands of the
      # application name no file of the checkout, however the path is written, and
      # the configuration came from the package the provider restored, the
      # version the package job made.
      - name: Check the build reaches nothing of the checkout
        shell: pwsh
        working-directory: ${{ env.APP }}
        run: |
          $build = "build/${{ matrix.preset }}"
          $checkout = $env:GITHUB_WORKSPACE.TrimEnd('\', '/')
          # Backslashes, forward slashes, and backslashes as JSON escapes them.
          $native = $checkout.Replace('/', '\')
          $forms = @($native, $checkout.Replace('\', '/'), $native.Replace('\', '\\'))
          foreach ($file in "$build/CMakeCache.txt", "$build/compile_commands.json") {
            if (-not (Test-Path $file)) { throw "the configure wrote no $file" }
            foreach ($form in $forms) {
              $hits = Select-String -Path $file -Pattern $form -SimpleMatch
              if ($hits) { $hits | Select-Object -First 10 | Out-String | Write-Host; throw "$file names the checkout $form" }
            }
          }
          $dir = (Select-String -Path "$build/CMakeCache.txt" -Pattern '^wxl_DIR:[A-Z]+=(.*)$').Matches[0].Groups[1].Value
          "wxl_DIR $dir"
          if ($dir -notmatch "/winxl/$([regex]::Escape($env:WXL_PACKAGE_VERSION))/build/native/lib/cmake/wxl$") {
            throw "find_package(wxl) took $dir, not WinXL $env:WXL_PACKAGE_VERSION restored by the provider"
          }
          "WXL_DIR=$dir" >> $env:GITHUB_ENV

      - name: Run core-only
        shell: pwsh
        working-directory: ${{ env.APP }}
        run: |
          $expected = "wxl ${env:WXL_PACKAGE_VERSION}: 9 code units"
          foreach ($config in 'Debug', 'Release') {
            $line = & "build/${{ matrix.preset }}/$config/core-only.exe"
            if ($LASTEXITCODE -ne 0) { throw "core-only ($config) exited with $LASTEXITCODE" }
            "$config`: $line"
            if ($line -ne $expected) { throw "core-only ($config) printed '$line', not '$expected'" }
          }

      # The experimental runtime the wrappers ask for, installed by winxl of the
      # package from the Runtime package the restore of the application
      # resolved; then the window of demo, twenty seconds in each
      # configuration, as ci.yml starts a sample.
      - name: Install the experimental Windows App Runtime
        shell: pwsh
        working-directory: ${{ env.APP }}
        run: |
          $winxl = Join-Path $env:WXL_DIR '../../../bin/winxl.exe'
          & $winxl runtime install --packages "build/${{ matrix.preset }}/wxl.packages/restored-packages.json"
          if ($LASTEXITCODE -ne 0) { throw "winxl runtime install exited with $LASTEXITCODE" }

      - name: Start demo
        shell: pwsh
        working-directory: ${{ env.APP }}
        run: |
          foreach ($config in 'Debug', 'Release') {
            $exe = Get-Item "build/${{ matrix.preset }}/$config/demo.exe"
            $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
            Start-Sleep -Seconds 20
            $p.Refresh()
            if ($p.HasExited) { throw "demo ($config) exited within 20 s, code $($p.ExitCode)" }
            $window = $p.MainWindowHandle
            "$config`: running after 20 s; main window handle $window, title '$($p.MainWindowTitle)'"
            Stop-Process -Id $p.Id
            if ($window -eq 0) { throw "demo ($config) runs but shows no main window" }
          }

  consumer-msbuild:
    needs: [version, pack]
    name: consumer (msbuild)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DEVCMD: C:\BuildToolsInsiders\Common7\Tools\VsDevCmd.bat
      VCVARS: -vcvars_ver=14.53
      WXL_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install MSVC 14.53 and the WinUI build tools
        shell: pwsh
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/insiders/vs_buildtools.exe' -OutFile $boot -UseBasicParsing
          $p = Start-Process -FilePath $boot -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -ArgumentList @(
            '--installPath', 'C:\BuildToolsInsiders',
            '--add', 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
            '--add', 'Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools',
            '--quiet', '--wait', '--norestart', '--nocache')
          "exit code $($p.ExitCode)"
          Get-ChildItem 'C:\BuildToolsInsiders\VC\Tools\MSVC' | ForEach-Object { $_.Name }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Build Tools install failed: $($p.ExitCode)" }

      # The application, out of the checkout: its sources, with the package
      # published into feed/, the local source of its nuget.config.
      - name: Copy the application out of the checkout
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'package-consumer'
          Copy-Item tests/package-consumer $app -Recurse
          "APP=$app" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          name: WinXL
          path: ${{ runner.temp }}/WinXL

      - name: Publish the package into the local feed
        shell: pwsh
        run: |
          cmake "-DWXL_PUBLISH_PACKAGE=$env:RUNNER_TEMP/WinXL/WinXL.$env:WXL_PACKAGE_VERSION.nupkg" "-DWXL_PUBLISH_FEED=$env:APP/feed" -P tools/package/publish.cmake
          if ($LASTEXITCODE -ne 0) { throw "publish.cmake exited with $LASTEXITCODE" }

      # MSBuild takes the toolset of a project from the property VCToolsVersion
      # and not from the developer environment, which sets only the variable.
      - name: Build
        shell: cmd
        working-directory: ${{ env.APP }}
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          for %%c in (Debug Release) do (
            msbuild msbuild\demo.vcxproj -restore -nologo -verbosity:minimal -p:Configuration=%%c -p:Platform=x64 -p:VCToolsVersion=%VCToolsVersion% "-p:RestoreConfigFile=%APP%\nuget.config" || exit /b 1
          )

      - name: Run core-only
        shell: pwsh
        working-directory: ${{ env.APP }}
        run: |
          $expected = "wxl ${env:WXL_PACKAGE_VERSION}: 9 code units"
          foreach ($config in 'Debug', 'Release') {
            $line = & "msbuild/build/$config/core-only.exe"
            if ($LASTEXITCODE -ne 0) { throw "core-only ($config) exited with $LASTEXITCODE" }
            "$config`: $line"
            if ($line -ne $expected) { throw "core-only ($config) printed '$line', not '$expected'" }
          }
