# A release checks both build directories, one after the other: first the rows
# of ci.yml on x64-dynamic -- the libraries, the samples and the tests with the
# CRT linked dynamically -- called as a reusable workflow, then the package,
# package.yml: the libraries of x64-dynamic and x64-static, Debug and Release,
# and the tool set -- the generator winui-srcgen, the profile editor wxl.gen.ui
# and the utility winxl, built in the x64-static build directory, the CRT
# linked statically (CMakePresets.json), in Release, run and tested
# (tools.yml) -- packed into the NuGet package WinXL. The run keeps the tool
# set as the artifact wxl-tools-x64 and the package as the artifact WinXL;
# neither is published.
#
# The static build directory is built and checked here only, at a release, and
# not on a pull request.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A tag push and a run by hand on the same ref wait for each other rather than
# run side by side; a release is not cancelled by the next one. The group is
# not release-<ref>: the rows of ci.yml called below take the caller's
# workflow name into their own group, and the two must differ.
concurrency:
  group: release-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ci.yml needs no secrets: its only token is github.token, of the job that
  # checks the commits of a pull request, which a release does not run.
  dynamic:
    uses: ./.github/workflows/ci.yml

  package:
    needs: [dynamic]
    uses: ./.github/workflows/package.yml
